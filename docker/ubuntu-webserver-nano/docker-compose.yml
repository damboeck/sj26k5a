services:
  webserver:
    image: ubuntu-webserver-nano
    build: .
    container_name: ${CONTAINER}
    hostname: ${CONTAINER}
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
      - "${SSH_PORT}:22"
    environment:
      - ROOT_PASSWORD=${ROOT_PASSWORD}
    volumes:
      - ${WEBROOT}:/var/www/html
